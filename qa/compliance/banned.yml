rules:
- id: motif:iron
  pattern: \biron\b
  category: brand
- id: motif:forge
  pattern: \bforg(?:e|es|ed|ing)\b
  category: brand
- id: placeholder:avi-to-confirm
  pattern: \[\s*avi to confirm\s*\]
  category: facts
  mask: false
- id: placeholder:unverified-in-publishable
  pattern: \[UNVERIFIED\]
  ignore_case: false
  paths:
  - content/**
  - publications/**
  - media/pitches/**
  category: facts
  mask: false
- id: private:patent-docket
  pattern: \bpatent\s+(?:docket|no\.?|number|#)
  category: private
- id: private:patent-number
  pattern: \b(?:US|U\.S\.)\s?\d{2}/\d{3},\d{3}\b
  ignore_case: false
  category: private
- id: pii:phone
  pattern: (?<![\w./-])(?:\+?1[\s.-])?\(?[2-9]\d{2}\)?[\s.-]\d{3}[\s.-]\d{4}(?![\w-])
  category: pii
- id: pii:street-address
  pattern: \b(?!(?:1[89]|20)\d\d\b)\d{2,5}\s+[A-Z][a-z]+(?:\s[A-Z][a-z]+)?\s+(?:Road|Rd|Street|St|Avenue|Ave|Boulevard|Blvd|Drive|Dr|Lane|Ln|Court|Ct)\b(?!-)
  ignore_case: false
  category: pii
- id: secret:slack-webhook
  pattern: hooks\.slack\.com/(?:services|workflows|triggers)/
  category: secret
- id: secret:discord-webhook
  pattern: discord(?:app)?\.com/api/webhooks/
  category: secret
- id: secret:private-key
  pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  category: secret
- id: secret:assignment
  pattern: \b(?:api[_-]?key|secret|token|password|passwd)\b["\']?\s*[:=]\s*["\'][A-Za-z0-9_\-./+=]{20,}["\']
  category: secret
- id: secret:box-secrets-path
  pattern: /workspace/\.secrets
  category: secret
  mask: false
- id: private:box-private-docs
  pattern: \bprivate/(?:[\w-]+\.md)
  paths:
  - content/**
  - publications/**
  - speaking/**
  - media/**
  - site/**
  category: private
gated:
- id: paypal
  pattern: \bpay\s?pal\b
  approval_key: paypal
  except_paths:
  - ops/approvals.md
- id: global-payments
  pattern: (?-i:\bGlobal\s+Payments\b)|\bglobal\s+payments\s+inc\b
  approval_key: global_payments
  except_paths:
  - ops/approvals.md
emails:
  allowed_domains:
